# 六个月历史内盈利候选；最近两个月独立测试为负，不能证明稳定盈利。
# 40% APR 仅用于离线研究；实盘收益读取链上费用，不写入假设收益。
# Triton One 的 RPC/gRPC 完整地址需配置到 .env.solana；默认仅模拟。
# 新独立目录：不覆盖 config/solana.toml、EVM 配置或已有状态。
mode = "paper"
state_dir = "data/solana-regime-paper"
poll_seconds = 15
report_seconds = 60
adapter_path = "adapters/solana/bridge.mjs"

[solana]
pool = "5rCf1DM8LjKTw4YqhnoLcngyZYeNnQqztScTogYHAS6"
rpc_url_env = "LPMAKER_SOL_RPC_URL"
grpc_url_env = "LPMAKER_SOL_GRPC_URL"
grpc_token_env = "LPMAKER_SOL_GRPC_TOKEN"
private_key_env = "LPMAKER_SOL_PRIVATE_KEY"
require_grpc = true
slippage_bps = 30
max_transaction_fee_sol = 0.001
priority_fee_microlamports = 10000
min_native_sol = 0.03
max_rent_sol = 0.5
idle_timeout_seconds = 300

[hyperliquid]
http_url = "https://api.hyperliquid.xyz"
ws_url = "wss://api.hyperliquid.xyz/ws"
mainnet = true
coins = [
    "ETH",
    "BTC",
    "SOL",
]
hedge_coin = "SOL"
private_key_env = "LPMAKER_SOL_HL_PRIVATE_KEY"
leverage = 3
cross_margin = false
maker_wait_seconds = 15
emergency_slippage_bps = 30

[strategy]
total_capital = 200.0
lp_budget = 100.0
hedge_collateral = 40.0
reserve = 60.0
inside_hedge_ratio = 0.25
hedge_deadband_usd = 12.0
max_drawdown = 0.05
max_basis_bps = 100.0
max_data_age_seconds = 60
fast_drop_1h = 0.03
vol_short_hours = 6
vol_long_hours = 168
vol_pause_ratio = 2.5
vol_resume_ratio = 1.2
ema_fast_hours = 48
ema_slow_hours = 144
resume_healthy_hours = 6
cooldown_hours = 168
recovery_fraction = 0.25
recovery_step_hours = 4
breakout_buffer = 0.01
breakout_confirm_bars = 8
decision_bar_seconds = 900
hedge_release_buffer = 0.004

[[strategy.layers]]
name = "core"
weight = 1.0
half_width = 0.15

[regime]
ema_entry_hours = 96
ema_exit_hours = 144
momentum_hours = 168
min_momentum = 0.06
max_hourly_vol = 0.008
entry_vol_fraction = 1.0
max_momentum = 1.0
max_bar_range = 0.05
exit_buffer = 0.005
entry_confirm_hours = 6

[logging]
directory = "data/logs/solana-regime"
retained_files = 14
level = "info"

[websocket]
heartbeat_seconds = 20
heartbeat_timeout_seconds = 60
idle_timeout_seconds = 300
connect_timeout_seconds = 15
write_timeout_seconds = 10
reconnect_initial_ms = 1000
reconnect_max_seconds = 30
